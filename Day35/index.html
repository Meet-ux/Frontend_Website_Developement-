        .boxes::before{
            background-color: aqua;
            content: "MEET IS CODER";
        }  
        .boxes::after{
            background-color: aqua;
            content: "MEET IS CODER";
        }  
        .boxes::selection{
            background-color: black;
            color: brown;
        }
        .box::first-letter{
            color: chocolate;
            font-size: 50px;
        }
        input::placeholder{
            color: brown;
        }
    </style>
</head>
<body>
    <div class="boxes">
        <div data-color="primary" class="box">I AM FIRST BOX</div>
        <div class="box">I AM SECOND BOX</div>
        <div class="box">I AM THIRD BOX</div>
        <input type="text" placeholder="TYPE NAME">
    </div>

</body>
