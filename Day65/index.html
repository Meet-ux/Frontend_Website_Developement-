<body>
    <!-- 
        Write a program to calculate factorial of a number using reduce and using for loops


        6! = 6*5*4*3*2*1

     -->
    <script>
        console.log("Factorial of number")
        var a = [5];
        const fact = (n)=>{
                return n*(fact(n-1))
        }
        console.log(a.reduce(fact))
    </script>
