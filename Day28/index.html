<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 533px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        .box1 {
            margin: 0;
            padding: 0;
            height: 115px;
            width: 100%;
            background-color: aqua;
            position: absolute;
            top: 0px ;
            /* position: sticky;
            top: 0px ;  */
        }

        .box2 {
            background-color: bisque;
            
        }

        .box3 {
            background-color: cadetblue;
        }

        .box4 {
            background-color: chocolate;
        }
        .parent{
            padding: 3px;
            margin: 34px;
            border: 2px solid black;
            position: absolute;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
